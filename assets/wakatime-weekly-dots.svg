<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .subtitle { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #666666; }
      .lang-label { font: 600 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .time-label { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #444444; }
      .percent-label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; text-anchor: end; }
      
      /* 未点灯の黒丸トラック（薄い半透明の黒丸） */
      .dot-base {
        stroke: #000000;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 0 14;
        opacity: 0.15;
      }

      /* 点灯する黒丸（完全な真っ黒 ●） */
      .dot-active {
        stroke: #000000;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 0 14;
      }

      /* ぬるっと滑らかに黒丸を埋めていくアニメーション */
      @keyframes fillWidth {
        from { width: 0px; }
      }

      .bar-anim-1 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
      .bar-anim-2 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
      .bar-anim-3 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
      .bar-anim-4 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
      .bar-anim-5 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

    <clipPath id="clip-1"><rect class="bar-anim-1" x="140" y="-20" width="195" height="40" /></clipPath>
    <clipPath id="clip-2"><rect class="bar-anim-2" x="140" y="-20" width="135" height="40" /></clipPath>
    <clipPath id="clip-3"><rect class="bar-anim-3" x="140" y="-20" width="30" height="40" /></clipPath>
    <clipPath id="clip-4"><rect class="bar-anim-4" x="140" y="-20" width="16" height="40" /></clipPath>
    <clipPath id="clip-5"><rect class="bar-anim-5" x="140" y="-20" width="68" height="40" /></clipPath>
  </defs>

  <!-- カード背景（外枠なし・角丸純白カード） -->
  <rect class="bg" width="820" height="270" rx="8" />

  <g class="fade-in">
    <!-- ヘッダー -->
    <g transform="translate(30, 36)">
      <circle cx="6" cy="6" r="6" fill="#000000" />
      <text class="title" x="22" y="11">Weekly Coding Activity (WakaTime)</text>
      <text class="subtitle" x="760" y="11" text-anchor="end">Last 7 Days: 15 hrs 9 mins</text>
    </g>

    <!-- 言語行 1: Markdown -->
    <g transform="translate(30, 78)">
      <text class="lang-label" x="0" y="4">Markdown</text>
      <line class="dot-base" x1="148" y1="0" x2="596" y2="0" />
      <g clip-path="url(#clip-1)">
        <line class="dot-active" x1="148" y1="0" x2="596" y2="0" />
      </g>
      <text class="time-label" x="615" y="4">6 hrs 24 mins</text>
      <text class="percent-label" x="760" y="4">42.3 %</text>
    </g>

    <!-- 言語行 2: Python -->
    <g transform="translate(30, 116)">
      <text class="lang-label" x="0" y="4">Python</text>
      <line class="dot-base" x1="148" y1="0" x2="596" y2="0" />
      <g clip-path="url(#clip-2)">
        <line class="dot-active" x1="148" y1="0" x2="596" y2="0" />
      </g>
      <text class="time-label" x="615" y="4">4 hrs 27 mins</text>
      <text class="percent-label" x="760" y="4">29.4 %</text>
    </g>

    <!-- 言語行 3: TypeScript -->
    <g transform="translate(30, 154)">
      <text class="lang-label" x="0" y="4">TypeScript</text>
      <line class="dot-base" x1="148" y1="0" x2="596" y2="0" />
      <g clip-path="url(#clip-3)">
        <line class="dot-active" x1="148" y1="0" x2="596" y2="0" />
      </g>
      <text class="time-label" x="615" y="4">59 mins</text>
      <text class="percent-label" x="760" y="4">6.6 %</text>
    </g>

    <!-- 言語行 4: Bash -->
    <g transform="translate(30, 192)">
      <text class="lang-label" x="0" y="4">Bash</text>
      <line class="dot-base" x1="148" y1="0" x2="596" y2="0" />
      <g clip-path="url(#clip-4)">
        <line class="dot-active" x1="148" y1="0" x2="596" y2="0" />
      </g>
      <text class="time-label" x="615" y="4">26 mins</text>
      <text class="percent-label" x="760" y="4">2.9 %</text>
    </g>

    <!-- 言語行 5: Others -->
    <g transform="translate(30, 230)">
      <text class="lang-label" x="0" y="4">Others</text>
      <line class="dot-base" x1="148" y1="0" x2="596" y2="0" />
      <g clip-path="url(#clip-5)">
        <line class="dot-active" x1="148" y1="0" x2="596" y2="0" />
      </g>
      <text class="time-label" x="615" y="4">2 hrs 13 mins</text>
      <text class="percent-label" x="760" y="4">14.7 %</text>
    </g>
  </g>
</svg>
