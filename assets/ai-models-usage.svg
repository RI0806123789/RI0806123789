<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 233" width="495" height="233">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #666666; }
      .model-label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .token-label { font: 500 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #444444; }
      .percent-label { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; text-anchor: end; }
      .footer-label { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #777777; }
      
      /* 未点灯の黒丸トラック（存在感を高めた 9px 仕様） */
      .dot-base {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
        opacity: 0.15;
      }

      /* 点灯する黒丸（完全な真っ黒 ●） */
      .dot-active {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
      }

      /* ぬるっと滑らかに黒丸を埋めていくアニメーション（macOS Dock風のイージング） */
      @keyframes fillWidth {
        from { width: 0px; }
      }

      .bar-anim-1 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
      .bar-anim-2 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
      .bar-anim-3 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
      .bar-anim-4 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

    <!-- トラック長 220 (x1=90, x2=310)。点灯幅 = 9 + 割合 × 220 -->
    <!-- Opus: 68.2% -> 9 + 0.682 * 220 = 159.0 -> 159 -->
    <clipPath id="model-clip-1"><rect class="bar-anim-1" x="81" y="-20" width="159" height="40" /></clipPath>
    <!-- GPT: 24.0% -> 9 + 0.240 * 220 = 61.8 -> 62 -->
    <clipPath id="model-clip-2"><rect class="bar-anim-2" x="81" y="-20" width="62" height="40" /></clipPath>
    <!-- Gemini: 6.4% -> 9 + 0.064 * 220 = 23.0 -> 23 -->
    <clipPath id="model-clip-3"><rect class="bar-anim-3" x="81" y="-20" width="23" height="40" /></clipPath>
    <!-- Sonnet: 1.0% -> 9 + 0.010 * 220 = 11.2 -> 11 -->
    <clipPath id="model-clip-4"><rect class="bar-anim-4" x="81" y="-20" width="11" height="40" /></clipPath>
  </defs>

  <!-- カード背景（GitHub Stats / Streak カードと同じ 495×233） -->
  <rect class="bg" width="495" height="233" rx="8" />

  <g class="fade-in">
    <!-- ヘッダー (上段Statsカードと同じ 18px / 14px に拡大) -->
    <g transform="translate(25, 29)">
      <circle cx="7" cy="7" r="7" fill="#000000" />
      <text class="title" x="24" y="13">AI Models Usage</text>
      <text class="subtitle" x="445" y="13" text-anchor="end">Total: 489.4M Tokens</text>
    </g>

    <!-- モデル行 1: Opus (68%) -->
    <g transform="translate(25, 72)">
      <text class="model-label" x="0" y="5">Opus</text>
      <line class="dot-base" x1="90" y1="0" x2="310" y2="0" />
      <g clip-path="url(#model-clip-1)">
        <line class="dot-active" x1="90" y1="0" x2="310" y2="0" />
      </g>
      <text class="token-label" x="326" y="5">333.7M</text>
      <text class="percent-label" x="445" y="5">68.2 %</text>
    </g>

    <!-- モデル行 2: GPT (24%) -->
    <g transform="translate(25, 110)">
      <text class="model-label" x="0" y="5">GPT</text>
      <line class="dot-base" x1="90" y1="0" x2="310" y2="0" />
      <g clip-path="url(#model-clip-2)">
        <line class="dot-active" x1="90" y1="0" x2="310" y2="0" />
      </g>
      <text class="token-label" x="326" y="5">117.4M</text>
      <text class="percent-label" x="445" y="5">24.0 %</text>
    </g>

    <!-- モデル行 3: Gemini (6%) -->
    <g transform="translate(25, 148)">
      <text class="model-label" x="0" y="5">Gemini</text>
      <line class="dot-base" x1="90" y1="0" x2="310" y2="0" />
      <g clip-path="url(#model-clip-3)">
        <line class="dot-active" x1="90" y1="0" x2="310" y2="0" />
      </g>
      <text class="token-label" x="326" y="5">31.2M</text>
      <text class="percent-label" x="445" y="5">6.4 %</text>
    </g>

    <!-- モデル行 4: Sonnet (1%) -->
    <g transform="translate(25, 186)">
      <text class="model-label" x="0" y="5">Sonnet</text>
      <line class="dot-base" x1="90" y1="0" x2="310" y2="0" />
      <g clip-path="url(#model-clip-4)">
        <line class="dot-active" x1="90" y1="0" x2="310" y2="0" />
      </g>
      <text class="token-label" x="326" y="5">5.0M</text>
      <text class="percent-label" x="445" y="5">1.0 %</text>
    </g>

    <!-- フッター: トークン詳細サマリー (12px に拡大) -->
    <g transform="translate(25, 214)">
      <text class="footer-label" x="0" y="0">Cached: 475.6M (97.2%) · Input: 12.3M · Output: 1.4M</text>
    </g>
  </g>
</svg>
