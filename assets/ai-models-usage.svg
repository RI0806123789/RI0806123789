<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 221" width="495" height="221">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #666666; }
      .model-label { font: 600 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .token-label { font: 500 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #444444; }
      .percent-label { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; text-anchor: end; }
      .footer-label { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #777777; }
      
      /* 未点灯の黒丸トラック（存在感を高めた 9px 仕様） */
      .dot-base {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
        opacity: 0.15;
      }

      /* 点灯する黒丸（完全な真っ黒 ●） */
      .dot-active {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
      }

      /* ぬるっと滑らかに黒丸を埋めていくアニメーション（macOS Dock風のイージング） */
      @keyframes fillWidth {
        from { width: 0px; }
      }

      .bar-anim-1 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
      .bar-anim-2 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
      .bar-anim-3 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
      .bar-anim-4 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
      .bar-anim-5 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

    <!-- トラック長 210 (x1=104, x2=314)。点灯幅 = 9 + 割合 × 210 -->
    <clipPath id="model-clip-1"><rect class="bar-anim-1" x="95" y="-20" width="127" height="40" /></clipPath>
    <clipPath id="model-clip-2"><rect class="bar-anim-2" x="95" y="-20" width="80" height="40" /></clipPath>
    <clipPath id="model-clip-3"><rect class="bar-anim-3" x="95" y="-20" width="26" height="40" /></clipPath>
    <clipPath id="model-clip-4"><rect class="bar-anim-4" x="95" y="-20" width="13" height="40" /></clipPath>
  </defs>

  <!-- カード背景（4モデル） -->
  <rect class="bg" width="495" height="221" rx="8" />

  <g class="fade-in">
    <!-- ヘッダー (上段Statsカードと同じ 18px / 14px に拡大) -->
    <g transform="translate(25, 27)">
      <circle cx="7" cy="7" r="7" fill="#000000" />
      <text class="title" x="24" y="13">AI Models Usage</text>
      <text class="subtitle" x="445" y="13" text-anchor="end">Total: ≈222.3M Tokens</text>
    </g>

    <!-- モデル行 1: GPT (56%) -->
    <g transform="translate(25, 66)">
      <text class="model-label" x="0" y="5">GPT</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-1)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">124.8M</text>
      <text class="percent-label" x="445" y="5">56 %</text>
    </g>

    <!-- モデル行 2: Sonnet (34%) -->
    <g transform="translate(25, 100)">
      <text class="model-label" x="0" y="5">Sonnet</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-2)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">75.6M</text>
      <text class="percent-label" x="445" y="5">34 %</text>
    </g>

    <!-- モデル行 3: Haiku (8%) -->
    <g transform="translate(25, 134)">
      <text class="model-label" x="0" y="5">Haiku</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-3)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">17.6M</text>
      <text class="percent-label" x="445" y="5">8 %</text>
    </g>

    <!-- モデル行 4: Opus (2%) -->
    <g transform="translate(25, 168)">
      <text class="model-label" x="0" y="5">Opus</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-4)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">4.3M</text>
      <text class="percent-label" x="445" y="5">2 %</text>
    </g>

    <!-- フッター: トークン詳細サマリー (12px に拡大) -->
    <g transform="translate(25, 200)">
      <text class="footer-label" x="0" y="0">Cached: ≈212.8M · Input: ≈8.5M · Output: ≈754.2K</text>
    </g>
  </g>
</svg>
