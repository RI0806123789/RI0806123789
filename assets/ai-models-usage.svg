<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 255" width="495" height="255">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #666666; }
      .model-label { font: 600 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .token-label { font: 500 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #444444; }
      .percent-label { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; text-anchor: end; }
      .footer-label { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #777777; }
      
      /* 未点灯の黒丸トラック（存在感を高めた 9px 仕様） */
      .dot-base {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
        opacity: 0.15;
      }

      /* 点灯する黒丸（完全な真っ黒 ●） */
      .dot-active {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
      }

      /* ぬるっと滑らかに黒丸を埋めていくアニメーション（macOS Dock風のイージング） */
      @keyframes fillWidth {
        from { width: 0px; }
      }

      .bar-anim-1 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
      .bar-anim-2 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
      .bar-anim-3 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
      .bar-anim-4 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
      .bar-anim-5 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

    <!-- トラック長 210 (x1=104, x2=314)。点灯幅 = 9 + 割合 × 210 -->
    <!-- Opus: 81.7% -> 9 + 0.817 * 210 = 180.6 -> 181 -->
    <clipPath id="model-clip-1"><rect class="bar-anim-1" x="95" y="-20" width="181" height="40" /></clipPath>
    <!-- GPT: 15.8% -> 9 + 0.158 * 210 = 42.1 -> 42 -->
    <clipPath id="model-clip-2"><rect class="bar-anim-2" x="95" y="-20" width="42" height="40" /></clipPath>
    <!-- Gemini: 1.9% -> 9 + 0.019 * 210 = 13.0 -> 13 -->
    <clipPath id="model-clip-3"><rect class="bar-anim-3" x="95" y="-20" width="13" height="40" /></clipPath>
    <!-- Sonnet: 0.42% -> 9 + 0.0042 * 210 = 9.9 -> 10 -->
    <clipPath id="model-clip-4"><rect class="bar-anim-4" x="95" y="-20" width="10" height="40" /></clipPath>
    <!-- Codex-Vscode: 0.20% -> 9 + 0.0020 * 210 = 9.4 -> 9 -->
    <clipPath id="model-clip-5"><rect class="bar-anim-5" x="95" y="-20" width="9" height="40" /></clipPath>
  </defs>

  <!-- カード背景（GitHub Stats / Streak カードと同じ 495×255） -->
  <rect class="bg" width="495" height="255" rx="8" />

  <g class="fade-in">
    <!-- ヘッダー (上段Statsカードと同じ 18px / 14px に拡大) -->
    <g transform="translate(25, 27)">
      <circle cx="7" cy="7" r="7" fill="#000000" />
      <text class="title" x="24" y="13">AI Models Usage</text>
      <text class="subtitle" x="445" y="13" text-anchor="end">Total: 597.2M Tokens</text>
    </g>

    <!-- モデル行 1: Opus (81.7%) -->
    <g transform="translate(25, 66)">
      <text class="model-label" x="0" y="5">Opus</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-1)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">487.9M</text>
      <text class="percent-label" x="445" y="5">81.7 %</text>
    </g>

    <!-- モデル行 2: GPT (15.8%) -->
    <g transform="translate(25, 100)">
      <text class="model-label" x="0" y="5">GPT</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-2)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">94.1M</text>
      <text class="percent-label" x="445" y="5">15.8 %</text>
    </g>

    <!-- モデル行 3: Gemini (1.9%) -->
    <g transform="translate(25, 134)">
      <text class="model-label" x="0" y="5">Gemini</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-3)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">11.5M</text>
      <text class="percent-label" x="445" y="5">1.9 %</text>
    </g>

    <!-- モデル行 4: Sonnet (0.43%) -->
    <g transform="translate(25, 168)">
      <text class="model-label" x="0" y="5">Sonnet</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-4)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">2.5M</text>
      <text class="percent-label" x="445" y="5">0.43 %</text>
    </g>

    <!-- モデル行 5: Codex-Vscode (0.20%) -->
    <g transform="translate(25, 202)">
      <text class="model-label" x="0" y="5">Codex-Vscode</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-5)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">1.2M</text>
      <text class="percent-label" x="445" y="5">0.20 %</text>
    </g>

    <!-- フッター: トークン詳細サマリー (12px に拡大) -->
    <g transform="translate(25, 234)">
      <text class="footer-label" x="0" y="0">Cached: 582.7M (97.6%) · Input: 12.3M · Output: 2.3M</text>
    </g>
  </g>
</svg>
