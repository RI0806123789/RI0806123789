<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #666666; }
      .model-label { font: 600 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .token-label { font: 500 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #444444; }
      .percent-label { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; text-anchor: end; }
      .footer-label { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #777777; }
      
      /* 未点灯の黒丸トラック（存在感を高めた 9px 仕様） */
      .dot-base {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
        opacity: 0.15;
      }

      /* 点灯する黒丸（完全な真っ黒 ●） */
      .dot-active {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
      }

      /* ぬるっと滑らかに黒丸を埋めていくアニメーション（macOS Dock風のイージング） */
      @keyframes fillWidth {
        from { width: 0px; }
      }

      .bar-anim-1 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
      .bar-anim-2 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
      .bar-anim-3 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
      .bar-anim-4 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
      .bar-anim-5 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

    <!-- トラック長 210 (x1=104, x2=314)。点灯幅 = 9 + 割合 × 210 -->
    <clipPath id="model-clip-1"><rect class="bar-anim-1" x="95" y="-20" width="119" height="40" /></clipPath>
    <clipPath id="model-clip-2"><rect class="bar-anim-2" x="95" y="-20" width="50" height="40" /></clipPath>
    <clipPath id="model-clip-3"><rect class="bar-anim-3" x="95" y="-20" width="43" height="40" /></clipPath>
    <clipPath id="model-clip-4"><rect class="bar-anim-4" x="95" y="-20" width="30" height="40" /></clipPath>
    <clipPath id="model-clip-5"><rect class="bar-anim-5" x="95" y="-20" width="9" height="40" /></clipPath>
  </defs>

  <!-- 2026-11-21 取得。ccusage daily の JSON 出力（全期間 2026-05-08〜11-21、Claude Code / Codex / Antigravity / OpenCode など取得できた全エージェントの合算）。モデル系統別に集計し、割合は全トークンに対する比率（Haiku・無料モデルなどその他は行から省略） -->
  <!-- カード背景（5モデル。他の3枚と同じ 495×195 にそろえるため行間 25） -->
  <rect class="bg" width="495" height="195" rx="8" />

  <g class="fade-in">
    <!-- ヘッダー (上段Statsカードと同じ 18px / 14px に拡大) -->
    <g transform="translate(25, 27)">
      <circle cx="7" cy="7" r="7" fill="#000000" />
      <text class="title" x="24" y="13">AI Models Usage</text>
      <text class="subtitle" x="445" y="13" text-anchor="end">Total: ≈8.68B Tokens</text>
    </g>

    <!-- モデル行 1: Opus (52.3%) -->
    <g transform="translate(25, 62)">
      <text class="model-label" x="0" y="5">Opus</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-1)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">4.55B</text>
      <text class="percent-label" x="445" y="5">52.3 %</text>
    </g>

    <!-- モデル行 2: Sonnet (19.7%) -->
    <g transform="translate(25, 87)">
      <text class="model-label" x="0" y="5">Sonnet</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-2)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">1.71B</text>
      <text class="percent-label" x="445" y="5">19.7 %</text>
    </g>

    <!-- モデル行 3: GPT (16.1%) -->
    <g transform="translate(25, 112)">
      <text class="model-label" x="0" y="5">GPT</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-3)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">1.40B</text>
      <text class="percent-label" x="445" y="5">16.1 %</text>
    </g>

    <!-- モデル行 4: Gemini (10.0%) -->
    <g transform="translate(25, 137)">
      <text class="model-label" x="0" y="5">Gemini</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-4)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">866.6M</text>
      <text class="percent-label" x="445" y="5">10.0 %</text>
    </g>

    <!-- モデル行 5: Fable (0.21%) -->
    <g transform="translate(25, 162)">
      <text class="model-label" x="0" y="5">Fable</text>
      <line class="dot-base" x1="104" y1="0" x2="314" y2="0" />
      <g clip-path="url(#model-clip-5)">
        <line class="dot-active" x1="104" y1="0" x2="314" y2="0" />
      </g>
      <text class="token-label" x="328" y="5">18.0M</text>
      <text class="percent-label" x="445" y="5">0.21 %</text>
    </g>

    <!-- フッター: トークン詳細サマリー (12px に拡大) -->
    <g transform="translate(25, 186)">
      <text class="footer-label" x="0" y="0">Cached: ≈8.53B · Input: ≈127.8M · Output: ≈28.4M</text>
    </g>
  </g>
</svg>
