<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #666666; }
      .lang-label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .time-label { font: 500 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #444444; }
      .percent-label { font: 700 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; text-anchor: end; }

      /* 未点灯の黒丸トラック（存在感を高めた 9px 仕様） */
      .dot-base {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
        opacity: 0.15;
      }

      /* 点灯する黒丸 */
      .dot-active {
        stroke: #000000;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-dasharray: 0 15;
      }

      /* ぬるっと滑らかに黒丸を埋めていくアニメーション */
      @keyframes fillWidth {
        from { width: 0px; }
      }

      .bar-anim-1 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
      .bar-anim-2 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
      .bar-anim-3 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
      .bar-anim-4 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

    <!-- トラック長 240 (x1=130, x2=370)。点灯幅 = 9 + 割合 × 240 -->
    <clipPath id="pt-clip-1"><rect class="bar-anim-1" x="121" y="-20" width="83" height="40" /></clipPath>
    <clipPath id="pt-clip-2"><rect class="bar-anim-2" x="121" y="-20" width="95" height="40" /></clipPath>
    <clipPath id="pt-clip-3"><rect class="bar-anim-3" x="121" y="-20" width="64" height="40" /></clipPath>
    <clipPath id="pt-clip-4"><rect class="bar-anim-4" x="121" y="-20" width="34" height="40" /></clipPath>
  </defs>

  <!-- カード背景（GitHub Stats / Streak カードと同じ 495×195） -->
  <rect class="bg" width="495" height="195" rx="8" />

  <g class="fade-in">
    <!-- ヘッダー (上段Statsカードと同じ 18px / 14px に拡大) -->
    <g transform="translate(25, 29)">
      <circle cx="7" cy="7" r="7" fill="#000000" />
      <text class="title" x="24" y="13">Productive Time</text>
      <text class="subtitle" x="445" y="13" text-anchor="end">Early Bird · Peak 15:00</text>
    </g>

    <!-- 時間帯 1: Morning (06-12) 70 commits -->
    <g transform="translate(25, 70)">
      <text class="lang-label" x="0" y="5">Morning</text>
      <text class="time-label" x="72" y="5">06-12</text>
      <line class="dot-base" x1="130" y1="0" x2="370" y2="0" />
      <g clip-path="url(#pt-clip-1)">
        <line class="dot-active" x1="130" y1="0" x2="370" y2="0" />
      </g>
      <text class="percent-label" x="445" y="5">30.8 %</text>
    </g>

    <!-- 時間帯 2: Daytime (12-18) 81 commits -->
    <g transform="translate(25, 102)">
      <text class="lang-label" x="0" y="5">Daytime</text>
      <text class="time-label" x="72" y="5">12-18</text>
      <line class="dot-base" x1="130" y1="0" x2="370" y2="0" />
      <g clip-path="url(#pt-clip-2)">
        <line class="dot-active" x1="130" y1="0" x2="370" y2="0" />
      </g>
      <text class="percent-label" x="445" y="5">35.7 %</text>
    </g>

    <!-- 時間帯 3: Evening (18-24) 52 commits -->
    <g transform="translate(25, 134)">
      <text class="lang-label" x="0" y="5">Evening</text>
      <text class="time-label" x="72" y="5">18-24</text>
      <line class="dot-base" x1="130" y1="0" x2="370" y2="0" />
      <g clip-path="url(#pt-clip-3)">
        <line class="dot-active" x1="130" y1="0" x2="370" y2="0" />
      </g>
      <text class="percent-label" x="445" y="5">22.9 %</text>
    </g>

    <!-- 時間帯 4: Night (00-06) 24 commits -->
    <g transform="translate(25, 166)">
      <text class="lang-label" x="0" y="5">Night</text>
      <text class="time-label" x="72" y="5">00-06</text>
      <line class="dot-base" x1="130" y1="0" x2="370" y2="0" />
      <g clip-path="url(#pt-clip-4)">
        <line class="dot-active" x1="130" y1="0" x2="370" y2="0" />
      </g>
      <text class="percent-label" x="445" y="5">10.6 %</text>
    </g>
  </g>
</svg>
