<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .subtitle { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #666666; }
      .lang-label { font: 600 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; }
      .time-label { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #444444; }
      .percent-label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; fill: #000000; text-anchor: end; }

      /* 未点灯の黒丸トラック（週間アクティビティSVGと同じ仕様） */
      .dot-base {
        stroke: #000000;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 0 14;
        opacity: 0.15;
      }

      /* 点灯する黒丸 */
      .dot-active {
        stroke: #000000;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 0 14;
      }

      /* ぬるっと滑らかに黒丸を埋めていくアニメーション */
      @keyframes fillWidth {
        from { width: 0px; }
      }

      .bar-anim-1 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
      .bar-anim-2 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
      .bar-anim-3 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
      .bar-anim-4 { animation: fillWidth 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

    <!-- 点灯幅 = 8 + 割合 × トラック長(266) -->
    <clipPath id="pt-clip-1"><rect class="bar-anim-1" x="112" y="-20" width="87" height="40" /></clipPath>
    <clipPath id="pt-clip-2"><rect class="bar-anim-2" x="112" y="-20" width="112" height="40" /></clipPath>
    <clipPath id="pt-clip-3"><rect class="bar-anim-3" x="112" y="-20" width="67" height="40" /></clipPath>
    <clipPath id="pt-clip-4"><rect class="bar-anim-4" x="112" y="-20" width="32" height="40" /></clipPath>
  </defs>

  <!-- カード背景（GitHub Stats カードと同じ 495×195） -->
  <rect class="bg" width="495" height="195" rx="8" />

  <g class="fade-in">
    <!-- ヘッダー -->
    <g transform="translate(25, 28)">
      <circle cx="6" cy="6" r="6" fill="#000000" />
      <text class="title" x="22" y="11">Productive Time</text>
      <text class="subtitle" x="445" y="11" text-anchor="end">Early Bird · Peak 15:00</text>
    </g>

    <!-- 時間帯 1: Morning (06-12) 75 commits -->
    <g transform="translate(25, 74)">
      <text class="lang-label" x="0" y="4">Morning</text>
      <text class="time-label" x="66" y="4">06-12</text>
      <line class="dot-base" x1="120" y1="0" x2="386" y2="0" />
      <g clip-path="url(#pt-clip-1)">
        <line class="dot-active" x1="120" y1="0" x2="386" y2="0" />
      </g>
      <text class="percent-label" x="445" y="4">29.6 %</text>
    </g>

    <!-- 時間帯 2: Daytime (12-18) 99 commits -->
    <g transform="translate(25, 104)">
      <text class="lang-label" x="0" y="4">Daytime</text>
      <text class="time-label" x="66" y="4">12-18</text>
      <line class="dot-base" x1="120" y1="0" x2="386" y2="0" />
      <g clip-path="url(#pt-clip-2)">
        <line class="dot-active" x1="120" y1="0" x2="386" y2="0" />
      </g>
      <text class="percent-label" x="445" y="4">39.1 %</text>
    </g>

    <!-- 時間帯 3: Evening (18-24) 56 commits -->
    <g transform="translate(25, 134)">
      <text class="lang-label" x="0" y="4">Evening</text>
      <text class="time-label" x="66" y="4">18-24</text>
      <line class="dot-base" x1="120" y1="0" x2="386" y2="0" />
      <g clip-path="url(#pt-clip-3)">
        <line class="dot-active" x1="120" y1="0" x2="386" y2="0" />
      </g>
      <text class="percent-label" x="445" y="4">22.1 %</text>
    </g>

    <!-- 時間帯 4: Night (00-06) 23 commits -->
    <g transform="translate(25, 164)">
      <text class="lang-label" x="0" y="4">Night</text>
      <text class="time-label" x="66" y="4">00-06</text>
      <line class="dot-base" x1="120" y1="0" x2="386" y2="0" />
      <g clip-path="url(#pt-clip-4)">
        <line class="dot-active" x1="120" y1="0" x2="386" y2="0" />
      </g>
      <text class="percent-label" x="445" y="4">9.1 %</text>
    </g>
  </g>
</svg>
